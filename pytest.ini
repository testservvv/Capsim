[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    slow: Gegenprobe braucht mehr als etwa 10 s (schnelle Stufe: -m "not slow")
    feld3d: nutzt den 3D-Feldlöser
    bem: nutzt das BEM-Körpermodell
# Unerwartete UserWarnings sind Fehler (vorher im Protokoll von Hand
# gezählt). Die Homogenisierungswarnungen treffen viele absichtlich
# spärlich oder auf Lochkreisen gebohrte Prüflinge; ausgewertet werden
# sie nur in den Gegenproben 48 und 53 selbst (dort mit eigenem Filter).
# Ebenso die Lochlage (Gegenprobe 73): sie trifft synthetische Prüflinge
# mit Lochkreisen nach Konvention (Gegenproben 9, 54, 60) und den
# Plattenrand der K67-Voreinstellung; ausgewertet in Gegenprobe 73.
# Der Punkt nach dem Anführungszeichen steht für den Doppelpunkt, den
# das ini-Format als Trenner liest.
filterwarnings =
    error::UserWarning
    ignore:squeeze_model='(1d|2d)'. (das Lochbild|die Lochkreis-Darstellung):UserWarning
    ignore:Lochlage.:UserWarning
